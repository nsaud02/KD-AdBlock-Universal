name: Extract KD AdBlock Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="KD-AdBlock-Universal-V1-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/kd-source
          unzip -q "$ZIP" -d /tmp/kd-source

          SOURCE="/tmp/kd-source"

          MAKEFILE=$(find "$SOURCE" -name Makefile -type f -print -quit)

          if [ -z "$MAKEFILE" ]; then
            echo "Makefile not found"
            exit 1
          fi

          SOURCE=$(dirname "$MAKEFILE")

          cp -a "$SOURCE"/. .

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract KD AdBlock source"
            git push
          fi
